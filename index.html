<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюджет - Планировщик ремонта</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Стили из вашего CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --secondary: #7209b7;
            --accent: #f72585;
            --success: #4cc9f0;
            --warning: #f8961e;
            --danger: #e63946;
            --light: #f8f9fa;
            --dark: #2b2d42;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .budget-section {
            background: rgba(248, 249, 250, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 1200px;
            box-shadow: var(--shadow-lg);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.8rem;
            color: var(--dark);
        }

        .section-header h2 i {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            color: white;
        }

        .budget-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .budget-card {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .budget-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .budget-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .main-budget .budget-icon {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .spent-budget .budget-icon {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
        }

        .remaining-budget .budget-icon {
            background: linear-gradient(135deg, var(--success), #4895ef);
        }

        .budget-info h3 {
            font-size: 1rem;
            color: var(--gray);
            margin-bottom: 5px;
        }

        .amount {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .expenses-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .expenses-section h3 {
            padding: 20px 25px;
            background: var(--light);
            margin: 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .table-container {
            overflow-x: auto;
        }

        .expenses-table {
            width: 100%;
            border-collapse: collapse;
        }

        .expenses-table th,
        .expenses-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--light-gray);
        }

        .expenses-table th {
            background: var(--light);
            font-weight: 600;
            color: var(--dark);
        }

        .delete-expense {
            color: var(--danger);
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            transition: var(--transition);
        }
    </style>
</head>

<body>
    <section id="budget" class="budget-section">
        <div class="section-header">
            <h2>
                <i class="fas fa-chart-pie"></i>
                Трекер бюджета
            </h2>
            <div class="header-actions">
                <button class="btn btn-primary" id="set-budget-btn">
                    <i class="fas fa-target"></i>
                    Установить бюджет
                </button>
                <button class="btn btn-accent" id="add-expense-btn">
                    <i class="fas fa-receipt"></i>
                    Добавить расход
                </button>
            </div>
        </div>

        <div class="budget-overview">
            <div class="budget-card main-budget">
                <div class="budget-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="budget-info">
                    <h3>Общий бюджет</h3>
                    <p class="amount total-budget">500 000,00 ₽</p>
                </div>
            </div>
            <div class="budget-card spent-budget">
                <div class="budget-icon">
                    <i class="fas fa-money-bill-wave"></i>
                </div>
                <div class="budget-info">
                    <h3>Потрачено</h3>
                    <p class="amount spent">30 000,00 ₽</p>
                </div>
            </div>
            <div class="budget-card remaining-budget">
                <div class="budget-icon">
                    <i class="fas fa-piggy-bank"></i>
                </div>
                <div class="budget-info">
                    <h3>Остаток</h3>
                    <p class="amount remaining">470 000,00 ₽</p>
                </div>
            </div>
        </div>

        <div class="expenses-section">
            <h3>История расходов</h3>
            <div class="table-container">
                <table class="expenses-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Категория</th>
                            <th>Описание</th>
                            <th>Сумма</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>25.10.2005</td>
                            <td>Материалы</td>
                            <td>Краска и др. материалы</td>
                            <td>20 000,00 ₽</td>
                            <td>
                                <span class="delete-expense">■</span>
                            </td>
                        </tr>
                        <tr>
                            <td>25.10.2005</td>
                            <td>Работа</td>
                            <td>Покраска стен</td>
                            <td>10 000,00 ₽</td>
                            <td>
                                <span class="delete-expense">■</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
