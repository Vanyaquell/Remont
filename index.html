<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюджет - Планировщик ремонта</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .budget-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }

        .budget-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .budget-header h1 {
            color: #2b2d42;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .budget-overview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .budget-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #e9ecef;
        }

        .budget-card h3 {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .amount {
            font-size: 2rem;
            font-weight: bold;
        }

        .total-budget {
            color: #4361ee;
        }

        .spent {
            color: #e63946;
        }

        .remaining {
            color: #2a9d8f;
        }

        .expenses-section {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .expenses-section h2 {
            background: #4361ee;
            color: white;
            padding: 20px;
            margin: 0;
            font-size: 1.5rem;
        }

        .expenses-table {
            width: 100%;
            border-collapse: collapse;
        }

        .expenses-table th,
        .expenses-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        .expenses-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2b2d42;
        }

        .category-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .category-материалы {
            background: #4cc9f0;
            color: white;
        }

        .category-работа {
            background: #f8961e;
            color: white;
        }

        .delete-btn {
            color: #e63946;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="budget-container">
        <div class="budget-header">
            <h1>Трекер бюджета</h1>
        </div>

        <div class="budget-overview">
            <div class="budget-card">
                <h3>Общий бюджет</h3>
                <p class="amount total-budget">500 000,00 ₽</p>
            </div>
            <div class="budget-card">
                <h3>Потрачено</h3>
                <p class="amount spent">30 000,00 ₽</p>
            </div>
            <div class="budget-card">
                <h3>Остаток</h3>
                <p class="amount remaining">470 000,00 ₽</p>
            </div>
        </div>

        <div class="expenses-section">
            <h2>История расходов</h2>
            <table class="expenses-table">
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Категория</th>
                        <th>Описание</th>
                        <th>Сумма</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>25.10.2005</td>
                        <td>
                            <span class="category-badge category-материалы">Материалы</span>
                        </td>
                        <td>Краска и др. материалы</td>
                        <td>20 000,00 ₽</td>
                        <td class="delete-btn">■</td>
                    </tr>
                    <tr>
                        <td>25.10.2005</td>
                        <td>
                            <span class="category-badge category-работа">Работа</span>
                        </td>
                        <td>Покраска стен</td>
                        <td>10 000,00 ₽</td>
                        <td class="delete-btn">■</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
